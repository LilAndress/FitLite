services:
  postgres:
    image: postgres:16
    container_name: fitlite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitlite_user
      POSTGRES_PASSWORD: fitlite_pass
      POSTGRES_DB: fitlite_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: