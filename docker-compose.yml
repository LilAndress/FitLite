services:
  postgres:
    image: postgres:16
    container_name: fitlite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitlite_user
      POSTGRES_PASSWORD: fitlite_pass
      POSTGRES_DB: fitlite_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlite_user -d fitlite_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: fitlite-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fitlite_db
      SPRING_DATASOURCE_USERNAME: fitlite_user
      SPRING_DATASOURCE_PASSWORD: fitlite_pass
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: fitlite-frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata: